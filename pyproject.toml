[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-gap-hunter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "ollama",
    "pydantic",
    "sqlite-utils",
    "python-dotenv",
    "sentence-transformers",
    "neo4j",
    "qdrant-client",
    "fastapi",
    "uvicorn",
    "numpy",
    "pymupdf",
]

[project.optional-dependencies]
dev = ["pytest"]

# Flat layout: setuptools cannot auto-discover here because the repo root holds
# several importable packages alongside non-package directories (data/, frontend/,
# qdrant_storage/). Listing them explicitly keeps the build deterministic; tests/
# is intentionally omitted so it is not installed into site-packages.
[tool.setuptools]
packages = ["pipeline", "graph", "vectors", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The integration tier runs the real pipeline against live Neo4j / Qdrant / Ollama.
# It is excluded by default so `pytest -q` stays a fast, hermetic unit run; opt in
# with `pytest -m integration`. Without the exclusion a contributor with no
# services running would see failures that say nothing about their change.
addopts = "-m 'not integration'"
markers = [
    "integration: exercises real Neo4j, Qdrant and Ollama; skipped when they are down",
]
