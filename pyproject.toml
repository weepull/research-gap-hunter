[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-gap-hunter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "ollama",
    # Hosted explanation backend, used only when DEMO_MODE=true (no local Ollama
    # on a public deployment). Imported lazily, so local dev never needs a key.
    "anthropic",
    "pydantic",
    "sqlite-utils",
    "python-dotenv",
    "sentence-transformers",
    "neo4j",
    "qdrant-client",
    "fastapi",
    "uvicorn",
    "numpy",
    "pymupdf",
]

[project.optional-dependencies]
dev = ["pytest"]

# Flat layout: setuptools cannot auto-discover here because the repo root holds
# several importable packages alongside non-package directories (data/, frontend/,
# qdrant_storage/). Listing them explicitly keeps the build deterministic; tests/
# is intentionally omitted so it is not installed into site-packages.
[tool.setuptools]
packages = ["pipeline", "graph", "vectors", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
